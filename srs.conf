# SRS configuration for Lolo Livestreaming
listen              1935;
max_connections     1000;
daemon              off;
srs_log_tank        console;

http_server {
    enabled         on;
    listen          8080;
    dir             ./objs/nginx/html;
}

http_api {
    enabled         on;
    listen          1985;
}

vhost __defaultVhost__ {
    hls {
        enabled         on;
        hls_fragment    1;
        hls_window      4;
        hls_path        ./objs/nginx/html;
        hls_m3u8_file   [app]/[stream].m3u8;
        hls_ts_file     [app]/[stream]-[seq].ts;
    }

    http_remux {
        enabled     on;
        mount       [vhost]/[app]/[stream].flv;
    }

    # Webhooks for Backend integration
    http_hooks {
        enabled         on;
        on_publish      http://192.168.1.137:8081/api/v1/srs/publish;
        on_unpublish    http://192.168.1.137:8081/api/v1/srs/unpublish;
    }
}
